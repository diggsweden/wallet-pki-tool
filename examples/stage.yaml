schemaVersion: 1
environment: stage
stateDir: ../.wallet-pki/stage/state
outputDir: ../.wallet-pki/stage/bundles

authorities:
  - id: pid-issuer
    commonName: "DIGG Wallet PID Issuer CA"
    keyFile: /run/secrets/wallet-pki/pid-issuer/key.pem
    certFile: /run/secrets/wallet-pki/pid-issuer/certificate.pem
    certificateUrl: https://trust.stage.example.test/pid-issuer/ca.pem
    crlUrl: https://trust.stage.example.test/pid-issuer/revocation-list.pem
  - id: wallet-provider
    commonName: "DIGG Wallet Provider CA"
    keyFile: /run/secrets/wallet-pki/wallet-provider/key.pem
    certFile: /run/secrets/wallet-pki/wallet-provider/certificate.pem
    certificateUrl: https://trust.stage.example.test/wallet-provider/ca.pem
    crlUrl: https://trust.stage.example.test/wallet-provider/revocation-list.pem
  - id: trust-source
    commonName: "DIGG Wallet Trust Source CA"
    keyFile: /run/secrets/wallet-pki/trust-source/key.pem
    certFile: /run/secrets/wallet-pki/trust-source/certificate.pem
    certificateUrl: https://trust.stage.example.test/trust-source/ca.pem
    crlUrl: https://trust.stage.example.test/trust-source/revocation-list.pem
  - id: verifier-access-certificate
    commonName: "DIGG Wallet Verifier Access Certificate CA"
    keyFile: /run/secrets/wallet-pki/verifier-access-certificate/key.pem
    certFile: /run/secrets/wallet-pki/verifier-access-certificate/certificate.pem
    certificateUrl: https://trust.stage.example.test/verifier-access-certificate/ca.pem
    crlUrl: https://trust.stage.example.test/verifier-access-certificate/revocation-list.pem
  - id: verifier-registration-certificate
    commonName: "DIGG Wallet Verifier Registration Certificate CA"
    keyFile: /run/secrets/wallet-pki/verifier-registration-certificate/key.pem
    certFile: /run/secrets/wallet-pki/verifier-registration-certificate/certificate.pem
    certificateUrl: https://trust.stage.example.test/verifier-registration-certificate/ca.pem
    crlUrl: https://trust.stage.example.test/verifier-registration-certificate/revocation-list.pem

identities:
  - id: pid-issuer
    profile: pid-issuer-service
    authority: pid-issuer
    commonName: "PID Issuer (Ecosystem)"
    country: SE
    organizationIdentifier: VATSE-12345678
    alias: pid_issuer
    passwordFile: /run/secrets/wallet-pki/passwords/pid-issuer
    sans: ["DNS:wallet.stage.example.test"]
    validityDays: 825
    renewBeforeDays: 30
  - id: wallet-provider
    profile: wallet-provider-service
    authority: wallet-provider
    commonName: "Wallet Provider (Ecosystem)"
    country: SE
    organizationIdentifier: VATSE-12345678
    alias: wallet_provider
    passwordFile: /run/secrets/wallet-pki/passwords/wallet-provider
    sans: ["DNS:wallet.stage.example.test"]
    validityDays: 825
    renewBeforeDays: 30
  - id: trust-list-signer
    profile: trust-source-signer
    authority: trust-source
    commonName: "Trust Source (Ecosystem)"
    country: SE
    organizationIdentifier: VATSE-12345678
    alias: trust_source
    passwordFile: /run/secrets/wallet-pki/passwords/trust-list-signer
    sans: ["DNS:wallet.stage.example.test"]
    validityDays: 825
    renewBeforeDays: 30
  - id: verifier-access-certificate
    profile: relying-party-access
    authority: verifier-access-certificate
    commonName: "Verifier Access (Ecosystem)"
    country: SE
    organizationIdentifier: VATSE-12345678
    alias: verifier_access_certificate
    passwordFile: /run/secrets/wallet-pki/passwords/verifier-access-certificate
    sans: ["DNS:wallet.stage.example.test"]
    validityDays: 825
    renewBeforeDays: 30
    cpsUrl: https://trust.stage.example.test/verifier-access-certificate/cps.md
  - id: verifier-registration-certificate
    profile: relying-party-registration
    authority: verifier-registration-certificate
    commonName: "Verifier Registration (Ecosystem)"
    country: SE
    organizationIdentifier: VATSE-12345678
    alias: registration
    passwordFile: /run/secrets/wallet-pki/passwords/verifier-registration-certificate
    sans: ["DNS:wallet.stage.example.test"]
    validityDays: 825
    renewBeforeDays: 30

documents:
  - id: lote
    type: lote
    signer: trust-list-signer
    validityDays: 365
    renewBeforeDays: 30
    schemeName: DIGG Wallet Environment
    schemeOperator: DIGG
    territory: SE
    entities:
      - reference: authority:pid-issuer
        role: pid
        name: PID Issuer
        uri: https://wallet.stage.example.test
        country: SE
      - reference: authority:wallet-provider
        role: wallet
        name: Wallet Provider
        uri: https://wallet.stage.example.test
        country: SE
      - reference: authority:verifier-access-certificate
        role: wrpac
        name: WRPAC Provider
        uri: https://wallet.stage.example.test
        country: SE
      - reference: authority:verifier-registration-certificate
        role: wrprc
        name: WRPRC Provider
        uri: https://wallet.stage.example.test
        country: SE
  - id: status-list
    type: status-list
    signer: trust-list-signer
    url: https://trust.stage.example.test/signed/status-list.jwt
    validityDays: 365
    renewBeforeDays: 30
  - id: issuer-registration
    type: registration
    signer: pid-issuer
    validityDays: 365
    renewBeforeDays: 30
    claims:
      iss: did:web:wallet.stage.example.test
      sub: did:web:wallet.stage.example.test
  - id: verifier-registration
    type: registration
    signer: verifier-registration-certificate
    validityDays: 365
    renewBeforeDays: 30
    claims:
      name: DIGG Wallet Ecosystem
      sub: VATSE-12345678
      country: SE
      registry_uri: https://wallet.stage.example.test/local-registration-certificate/registry
      srv_description: [{lang: en, value: Local wallet ecosystem service}]
      entitlements: ["https://uri.etsi.org/19475/Entitlement/Service_Provider"]
      purpose: [{lang: en, value: Identification with credentials}]
      credentials:
        - format: dc+sd-jwt
          meta:
            vct_values: ["urn:eudi:pid:1"]
          claim:
            - path: [personal_administrative_number]
            - path: [family_name]
            - path: [given_name]
            - path: [birthdate]
            - path: [address, street_address]
            - path: [address, postal_code]
            - path: [address, locality]
            - path: [address, country]
      service_identifier: wallet-ecosystem
      intended_use_id: "1"
      privacy_policy: https://wallet.stage.example.test/local-registration-certificate/privacy
      info_uri: https://wallet.stage.example.test/local-registration-certificate/info
      support_uri: https://wallet.stage.example.test/local-registration-certificate/support
      supervisory_authority:
        name: Local Wallet Ecosystem
        country: SE
        email: walletecosystem@example.com
      policy_id: ["0.4.0.19475.3.1"]
      certificate_policy: https://wallet.stage.example.test/local-registration-certificate/certificate-policy
      status:
        status_list:
          uri: https://wallet.stage.example.test/local-registration-certificate/registration-certificate-status
          idx: 0

trustStores:
  - id: trusted-issuers
    certificates:
      - reference: identity:pid-issuer
        alias: pid_issuer
      - reference: authority:pid-issuer
        alias: pid_issuer_ca
    passwordFile: /run/secrets/wallet-pki/passwords/verifier-access-certificate

exports:
  - source: identity:pid-issuer
    format: pkcs12
    path: private/certificates/issuer/pid_issuer.p12
  - source: identity:wallet-provider
    format: pkcs12
    path: private/certificates/wallet-provider/wallet_provider.p12
  - source: identity:trust-list-signer
    format: pkcs12
    path: private/certificates/trust-list-signer/trust_source.p12
  - source: identity:verifier-access-certificate
    format: pkcs12
    path: private/certificates/verifier-access-certificate/verifier-access-certificate.p12
  - source: identity:verifier-registration-certificate
    format: pkcs12
    path: private/certificates/verifier-registration-certificate/verifier-registration-certificate.p12
  - source: truststore:trusted-issuers
    format: pkcs12
    path: private/certificates/trusted_issuers.p12
  - source: authority:pid-issuer
    format: certificate
    path: public/trust-source/pid-issuer/ca.pem
  - source: authority:pid-issuer
    format: crl
    path: public/trust-source/pid-issuer/revocation-list.pem
  - source: authority:wallet-provider
    format: certificate
    path: public/trust-source/wallet-provider/ca.pem
  - source: authority:wallet-provider
    format: crl
    path: public/trust-source/wallet-provider/revocation-list.pem
  - source: authority:trust-source
    format: certificate
    path: public/trust-source/trust-source/ca.pem
  - source: authority:trust-source
    format: crl
    path: public/trust-source/trust-source/revocation-list.pem
  - source: authority:verifier-access-certificate
    format: certificate
    path: public/trust-source/verifier-access-certificate/ca.pem
  - source: authority:verifier-access-certificate
    format: crl
    path: public/trust-source/verifier-access-certificate/revocation-list.pem
  - source: authority:verifier-registration-certificate
    format: certificate
    path: public/trust-source/verifier-registration-certificate/ca.pem
  - source: authority:verifier-registration-certificate
    format: crl
    path: public/trust-source/verifier-registration-certificate/revocation-list.pem
  - source: authority:trust-source
    format: crl
    path: public/trust-source/revocation-list.pem
  - source: document:lote
    format: compact
    path: public/trust-source/signed/trusted-entities.json
  - source: document:lote
    format: json
    path: public/trust-source/signed/trusted-entities.decoded.json
  - source: document:status-list
    format: compact
    path: public/trust-source/signed/status-list.jwt
  - source: document:status-list
    format: json
    path: public/trust-source/signed/status-list.json
  - source: document:issuer-registration
    format: compact
    path: public/pid-issuer/issuer_wrprc.jwt
  - source: document:issuer-registration
    format: json
    path: public/pid-issuer/issuer_wrprc.json
  - source: document:verifier-registration
    format: compact
    path: public/certificates/verifier-registration-certificate/registration_certificate.jwt
  - source: document:verifier-registration
    format: env
    path: public/certificates/verifier-registration-certificate/registration_certificate.env
    variable: VERIFIER_INTENDEDUSES_0_REGISTRATIONCERTIFICATE
  - source: file:assets/verifier-access-cps.md
    format: file
    path: public/trust-source/verifier-access-certificate/cps.md
