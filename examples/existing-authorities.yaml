schemaVersion: 2
environment: shared-test
stateDirectory: ../.wallet-pki/shared-test/state
outputDirectory: ../.wallet-pki/shared-test/bundles
publicationBaseUrl: https://trust.example.test

organization:
  name: DIGG
  country: SE
  identifier: VATSE-12345678

walletProvider:
  authority:
    source: existing
    certificateFile: /run/secrets/wallet-pki/wallet-provider/ca.pem
    privateKeyFile: /run/secrets/wallet-pki/wallet-provider/ca_private_key.pem
    crlFile: /run/secrets/wallet-pki/wallet-provider/revocation-list.pem
  signing:
    commonName: Wallet Provider (Test)
    subjectAlternativeNames:
      dns: [wallet-provider.example.test]
  keystorePassword:
    file: /run/secrets/wallet-pki/wallet-provider/keystore-password
