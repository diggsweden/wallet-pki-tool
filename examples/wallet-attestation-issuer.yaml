schemaVersion: 1
stateDirectory: ./.wallet-pki
outputDirectory: ./config

organization:
  name: DIGG
  country: SE
  identifier: VATSE-12345678

authorities:
  walletAttestationIssuer:
    commonName: DIGG Wallet Attestation Issuer CA

caDistribution:
  baseUrl: http://trust-source
  directory: trust-source
  rootCrlFile: trust-source/revocation-list.pem

walletAttestationIssuer:
  keystoreFile: certificates/wallet-attestation-issuer/wallet_attestation_issuer.p12
  signing:
    commonName: Wallet Attestation Issuer (Ecosystem)
    subjectAlternativeNames:
      dns: [localhost, wallet-attestation-issuer]
  keystorePassword:
    env: WALLET_ATTESTATION_ISSUER_KEYSTORE_PASSWORD
