schemaVersion: 1
stateDirectory: ./target/test-pki-state
outputDirectory: ./target/test-ecosystem

organization:
  name: DIGG
  country: SE
  identifier: VATSE-12345678

pidIssuer:
  signing:
    commonName: PID Issuer (Ecosystem)
    subjectAlternativeNames:
      dns: [localhost, pid-issuer]
  encryption:
    subjectAlternativeNames:
      dns: [localhost]
  keystorePassword:
    env: PID_ISSUER_KEYSTORE_PASSWORD
  registration:
    issuer: did:web:localhost
    subject: did:web:localhost

walletProvider:
  signing:
    commonName: Wallet Provider (Ecosystem)
    subjectAlternativeNames:
      dns: [localhost, wallet-provider]
  keystorePassword:
    env: WALLET_PROVIDER_KEYSTORE_PASSWORD

verifier:
  access:
    commonName: Verifier Backend (Ecosystem)
    subjectAlternativeNames:
      dns: [localhost, verifier-backend]
      uri: ['https://localhost/demo-verifier']
    keystorePassword:
      env: VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD
  registration:
    commonName: Verifier Registration (Ecosystem)
    keystorePassword:
      env: VERIFIER_REGISTRATION_CERTIFICATE_KEYSTORE_PASSWORD
    registration:
      name: DIGG Wallet Ecosystem
      serviceIdentifier: wallet-ecosystem
      intendedUseId: "1"
      publicBaseUrl: https://localhost/local-registration-certificate
      validityDays: 365
      description:
        - lang: en
          value: Local wallet ecosystem service
        - lang: sv
          value: Lokal wallet-ekosystemtjänst
      purpose:
        - lang: en
          value: Identification with credentials
        - lang: sv
          value: Identifiering med intyg
      requestedPidClaims:
        - personal_administrative_number
        - family_name
        - given_name
        - birthdate
        - address.street_address
        - address.postal_code
        - address.locality
        - address.country
      supervisoryAuthority:
        name: Local Wallet Ecosystem
        country: SE
        email: walletecosystem@example.com

trustSource:
  signer:
    commonName: Trust Source (Ecosystem)
    keystorePassword:
      env: TRUST_SOURCE_KEYSTORE_PASSWORD
  publicationBaseUrl: http://trust-source
  lote:
    name: Local LoTE
    sequenceNumber: 1
    validityDays: 365
    trustedAuthorities:
      pidIssuer:
        entityName: Local PID Provider
        serviceName: Local PID Issuance
        informationUrl: http://localhost
        streetAddress: Local
      walletProvider:
        entityName: Local Wallet Provider
        serviceName: Local Wallet Issuance
        informationUrl: http://localhost
        streetAddress: Local
      verifierAccess:
        entityName: Local WRPAC Provider
        serviceName: Local WRPAC Issuance
        informationUrl: http://localhost
        streetAddress: Local
      verifierRegistration:
        entityName: Local WRPRC Provider
        serviceName: Local WRPRC Issuance
        informationUrl: http://localhost
        streetAddress: Local
  statusList:
    url: http://trust-source/signed/status-list.jwt
    validityDays: 365
